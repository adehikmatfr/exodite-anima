name: Dependency vulnerability scan (OSV-Scanner)

# Closes finding D1 in cyber-security/report/dependency-review.md: no automated
# dependency vulnerability scan existed. Scans app/pubspec.lock against the
# OSV database. Results go to the repository's Security tab (code scanning),
# which needs no secret: it uses the GITHUB_TOKEN scoped below.
# https://google.github.io/osv-scanner/github-action/

on:
  pull_request:
    branches: [main, master]
  merge_group:
    branches: [main, master]
  push:
    branches: [main, master]
  schedule:
    - cron: "30 12 * * 1" # every Monday

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan-pr:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.6.0"
    with:
      scan-args: |-
        --lockfile=./app/pubspec.lock

  scan-scheduled:
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.6.0"
    with:
      scan-args: |-
        --lockfile=./app/pubspec.lock
